services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ql_sieuthi
    ports:
      - "3305:3306"
    volumes:
      - ./master/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./master/set_up.sql:/docker-entrypoint-initdb.d/set_up.sql
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  mysql-slave1:
    image: mysql:8.0
    container_name: mysql-slave1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - ./slave1/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  mysql-slave2:
    image: mysql:8.0
    container_name: mysql-slave2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - ./slave2/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  proxysql:
    image: proxysql/proxysql:latest
    container_name: proxysql
    restart: always
    ports:
      - "6033:6033" # Cổng ứng dụng/Workbench kết nối vào để tự tách Đọc/Ghi
      - "6032:6032" # Cổng Admin cấu hình ProxySQL
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave1:
        condition: service_healthy
      mysql-slave2:
        condition: service_healthy
    networks:
      - db-network

  watchdog:
    build: ./failover
    container_name: failover-watchdog
    restart: "always"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave1:
        condition: service_healthy
      mysql-slave2:
        condition: service_healthy
    networks:
      - db-network

networks:
  db-network:
    driver: bridge